name: Sync from ppkantorski/nx-ovlloader

# Ежедневно проверяем upstream. Если появились новые коммиты, они сразу
# вливаются в main одной merge-записью: без временных веток и без PR.
# Ручной запуск доступен на вкладке Actions.

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-nx-ovlloader-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main with complete history
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          submodules: false

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/ppkantorski/nx-ovlloader.git
          git fetch --no-tags upstream master

      - name: Merge new upstream commits into main
        env:
          UPSTREAM_URL: https://github.com/ppkantorski/nx-ovlloader.git
        run: |
          set -euo pipefail

          git config user.name "Dimasick-git"
          git config user.email "dimaorynchukk@gmail.com"

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "No new upstream commits."
            exit 0
          fi

          echo "Merging $(git rev-parse --short upstream/master) from $UPSTREAM_URL into main."
          # При конфликте предпочтение остаётся за пользовательскими файлами
          # (branding, README и workflow); остальные изменения upstream входят
          # в обычный merge и видны в истории main.
          git merge --no-edit -X ours upstream/master
          git push origin HEAD:main
